name: Trama agent — finish
description: >-
  Ends a Trama agent attempt (run it with if: always()): commits and pushes Claude's work, opens the pull request and
  reports the outcome, usage and errors to Trama, once.
author: Trama
branding:
  icon: check-circle
  color: purple

inputs:
  execution_file:
    description: The claude step's execution_file output (default $RUNNER_TEMP/claude-execution-output.json).
    required: false
    default: ""
  claude_outcome:
    description: The claude step's outcome (steps.<id>.outcome).
    required: false
    default: ""
  job_status:
    description: "The job's status (job.status): success, failure or cancelled."
    required: false
    default: ""
  timeout_minutes:
    description: The job's timeout-minutes, to tell a timeout from a cancellation.
    required: false
    default: "60"
  github_token:
    description: Token that pushes the branch and opens the pull request (default the job's GITHUB_TOKEN).
    required: false
    default: ""
  open_pull_request:
    description: >-
      "true" opens the pull request here with github_token (the repository must allow Actions to create pull requests);
      "false" pushes the branch and lets Trama open it with its GitHub App.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - id: finish
      shell: bash
      run: node "$GITHUB_ACTION_PATH/../scripts/finish.mjs"
      env:
        TRAMA_EXECUTION_FILE: ${{ inputs.execution_file }}
        TRAMA_CLAUDE_OUTCOME: ${{ inputs.claude_outcome }}
        TRAMA_JOB_STATUS: ${{ inputs.job_status }}
        TRAMA_TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
        TRAMA_OPEN_PULL_REQUEST: ${{ inputs.open_pull_request }}
